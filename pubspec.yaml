name: xpress_nepal
description: A Flutter e-commerce application for Nepal
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mocktail: ^1.0.3
  
  # Hive for local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  
  # Crypto for password hashing
  crypto: ^3.0.3

  
  
  #authentication
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0

  # Networking
  dio: ^5.4.1
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # HTTP for API calls
  http: ^1.2.0
  flutter_riverpod: ^3.2.0
  provider: ^6.1.5+1
  riverpod: ^3.2.0
  intl: ^0.20.2
  equatable: ^2.0.5
  sensors_plus: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  test_cov_console: ^0.2.2
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  
  # Add your assets here
  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/icons/
    - assets/images/onboarding/
    - assets/images/products/
    - assets/images/categories/
    - assets/images/banners/
    - assets/images/empty_states/
    - assets/animations/
    - assets/animations/lottie/
    
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo/logo.png
  min_sdk_android: 21
        